<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F3EBDD">
    <meta name="description" content="Chico's Colors is a modern digital color library inspired by Morocco's materials, craft, and light.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Chico's Colors | Inspired by Morocco">
    <meta property="og:description" content="Colors carry stories. Morocco has thousands.">
    <meta property="og:image" content="/img/Gemini_Generated_Image_adxgv3adxgv3adxg.jpg">
    <link rel="icon" type="image/svg+xml" href="/img/logo-mark.svg">
    <title>Chico's Colors | Inspired by Morocco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <script>
            (function () {
                var preference = "system";
                try {
                    var stored = JSON.parse(localStorage.getItem("chicos-theme"));
                    if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
                } catch (error) {}
                var theme = preference === "system"
                    ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
                    : preference;
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            })();
        </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" src="react.js"></script>
</body>
</html>
